services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: darkstore_postgres
    restart: always
    environment:
      POSTGRES_DB: darkstore_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d darkstore_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
